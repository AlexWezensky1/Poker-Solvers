<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red River Solver</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Red River Solver</h1>
    <nav class="elsewhere">
      <a href="/holdem/">Hold&rsquo;em</a>
      <a href="/noah/">Noah&rsquo;s Ark</a>
      <a href="/hmrds/">HMRDS</a>
      <a href="/">Home</a>
    </nav>
  </header>

  <section class="panel deck-panel">
    <div id="deck" class="deck"></div>
    <div class="side">
      <div id="speed" class="speed" role="group" aria-label="Solver speed">
        <button type="button" class="seg on" data-speed="fast">Fast</button>
        <button type="button" class="seg" data-speed="precise">Precise</button>
      </div>
      <button id="clear" type="button" class="ghost">Clear</button>
      <div id="status" class="status">
        <span class="status-line"></span>
        <span class="status-detail"></span>
      </div>
    </div>
  </section>

  <section class="table-panel">
    <div class="table">
      <div class="felt"></div>
      <div id="board" class="board"></div>
      <div id="players" class="players"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
