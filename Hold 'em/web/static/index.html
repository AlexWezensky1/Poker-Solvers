<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Hold'em Solver</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1>Texas Hold'em Solver</h1>
    <p class="sub">
      Click a card in the deck to deal it into the highlighted slot: hand 1, hand 2,
      the board, then hands 3 to 8. You can also type into any slot, like
      <code>As</code>, <code>Th</code>, <code>7d</code>, <code>2c</code>.
    </p>
  </header>

  <section class="panel table-panel">
    <div class="table">
      <div class="felt"></div>
      <div id="board" class="board"></div>
      <div id="players" class="players"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Deck</h2>
      <span class="hint">click a dealt card to take it back</span>
    </div>
    <div id="deck" class="deck"></div>
  </section>

  <div class="controls">
    <button id="calculate" type="button">Calculate</button>
    <button id="clear" type="button" class="ghost">Clear</button>
    <label class="accuracy">
      Preflop accuracy
      <select id="trials">
        <option value="25000">Fast</option>
        <option value="100000" selected>Normal</option>
        <option value="250000">Precise</option>
        <option value="exact">Exact (slower)</option>
      </select>
    </label>
  </div>

  <p id="status" class="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
