<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Hold'em Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Texas Hold'em Solver</h1>
  </header>

  <section class="panel">
    <div class="panel-head">
      <span class="hint">click a dealt card to take it back</span>
    </div>
    <div id="deck" class="deck"></div>
  </section>

  <div class="controls">
    <button id="calculate" type="button">Calculate</button>
    <button id="clear" type="button" class="ghost">Clear</button>
    <label class="accuracy">
      Preflop accuracy
      <select id="trials">
        <option value="25000">Fast</option>
        <option value="100000" selected>Normal</option>
        <option value="250000">Precise</option>
        <option value="exact">Exact (slower)</option>
      </select>
    </label>
  </div>

  <p id="status" class="status"></p>

  <section class="panel table-panel">
    <div class="table">
      <div class="felt"></div>
      <div id="board" class="board"></div>
      <div id="players" class="players"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
