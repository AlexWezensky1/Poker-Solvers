<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Hold'em Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Texas Hold'em Solver</h1>
  </header>

  <section class="panel deck-panel">
    <div id="deck" class="deck"></div>
    <div class="side">
      <button id="clear" type="button" class="ghost">Clear</button>
      <!-- Holds the column at the width of the longest line it can ever show,
           so a shorter count never resizes the deck beside it. -->
      <span class="status-sizer" aria-hidden="true">1,712,304 runouts in 10.123 seconds</span>
      <p id="status" class="status"></p>
    </div>
  </section>

  <section class="panel table-panel">
    <div class="table">
      <div class="felt"></div>
      <div id="board" class="board"></div>
      <div id="players" class="players"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
