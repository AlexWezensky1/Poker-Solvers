<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMRDS Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>HMRDS Solver</h1>
    <p class="blurb">
      Click the deck to deal. Any card the board matches is struck through &mdash;
      it has been discarded face up. Leave a seat's remaining slots empty and
      those cards are dealt at random, so a player you can only read by their
      discards still counts.
    </p>
  </header>

  <section class="panel deck-panel">
    <div id="deck" class="deck"></div>
    <div class="side">
      <button id="clear" type="button" class="ghost">Clear</button>
      <!-- Holds the column at the width of the longest line it can ever show,
           so a shorter status never resizes the deck beside it. -->
      <span class="status-sizer" aria-hidden="true">250,000 simulations in 10.123 seconds</span>
      <p id="status" class="status"></p>
    </div>
  </section>

  <section class="panel board-panel">
    <div class="felt"></div>
    <div id="board" class="board"></div>
  </section>

  <section id="players" class="players"></section>
</main>
<script src="app.js"></script>
</body>
</html>
